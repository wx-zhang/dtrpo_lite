dataset_path: EleutherAI/hendrycks_math
output_type: generate_until
training_split: train
test_split: test
doc_to_text: !function utils.math_doc_to_text
doc_to_target: "{{solution}}"
process_results: !function utils.process_math_results
generation_kwargs:
  until: ["Problem:", "</s>", "<|im_end|>"]
  do_sample: false
  temperature: 0.0
  max_gen_toks: 2048
num_fewshot: 0
metric_list:
  - metric: math_verify
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
